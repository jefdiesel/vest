[package]
name = "vesting-module-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Everything the Vest Basecamp module does, behind JSON-in/JSON-out calls (the module crate in ../rust-lib is a thin trait over it)"

[features]
# The chain: the SDK's LezBackend (a LEZ rc3 wallet + RPC from the settings). Without it the module
# keeps schedules in a JSON file and moves nothing: that is only for tests.
lez = ["vesting-sdk/lez"]

[dependencies]
vesting-sdk = { path = "../../../sdk", features = ["names", "guard"] }
vesting-core = { path = "../../../core" }
# The program's own types: the claim message Names Wallet signs, and the schedule state it reads.
vesting-program = { path = "../../../program" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
# The chain's block and transaction types (`getBlockRange` answers base64 borsh `common::block::Block`):
# `discover` reads Vest's accounts from the blocks with them. Same tag as the SDK's LEZ crates.
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"


[[example]]
name = "measure"
required-features = ["lez"]
