[package]
name = "vesting-module"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone crate: the empty table stops cargo adopting the parent workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["json-file-backend"]
# Store schedules/events in a JSON file (the CLI's format); used by the host tests.
json-file-backend = []
# Talk to the live LEZ rc3 chain through the SDK's LezBackend (needs a wallet + RPC from settings).
lez = ["vesting-sdk/lez"]

[dependencies]
# The merged SDK in this worktree now contains sdk/src/lez.rs.
vesting-sdk = { path = "../../../sdk" }
vesting-core = { path = "../../../core" }
borsh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
