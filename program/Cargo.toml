[package]
name = "vesting-program"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "RFP-017 vesting program for LEZ v0.4.0-rc3 (guest logic; vesting-core holds the rules)"

[dependencies]
vesting-core = { path = "../core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
# The 0.4 fungible token program (logos-blockchain/lez-programs, branch refactor/lez-v0.4.x).
token_core = { git = "https://github.com/logos-blockchain/lez-programs.git", rev = "cad71fc67d75ec9f6a07fc908f687678de7f7ed6" }
borsh = { version = "1", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[dev-dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
