[package]
name = "idl-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Checks idl/vesting.json (SPEL IDL v2) against the vesting program's own Borsh encoding"

[dependencies]

[dev-dependencies]
vesting-program = { path = "../program" }
vesting-core = { path = "../core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["host"] }
borsh = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
